name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website (PHP is not executed by GitHub Pages)
        run: |
          mkdir -p _site/data _site/icons
          cp index.html styles.css app.js race-schedule.html race-schedule.js _site/
          cp data/site-data.json _site/data/
          cp icons/* _site/icons/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
