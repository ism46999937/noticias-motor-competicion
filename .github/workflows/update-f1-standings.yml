name: Update championship data
on:
  schedule:
    - cron: "25 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: championship-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest available F1 standings
        run: python scripts/update_f1_standings.py
      - name: Fetch official FIA news headlines
        run: python scripts/update_news.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/site-data.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json
          git commit -m "Update championship data and news"
          git push
