name: Update Formula 1 standings
on:
  schedule:
    - cron: "25 7 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy website to GitHub Pages"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: f1-standings
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest available F1 standings
        run: python scripts/update_f1_standings.py
      - name: Commit changed standings
        run: |
          if git diff --quiet -- data/site-data.json; then
            echo "No new standings data to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json
          git commit -m "Update Formula 1 standings data"
          git push
